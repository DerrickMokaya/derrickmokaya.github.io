theme: jekyll-theme-chirpy

lang: en
timezone: Africa/Nairobi

title: Derrick Jesse Mokaya
tagline: Actuarial Science | Data Analytics | Finance
description: >-
  Portfolio of Derrick Jesse Mokaya — BSc Actuarial Science graduate, Data Analytics professional,
  and Finance & Data Intern based in Nairobi, Kenya. Passionate about financial modelling,
  data-driven insights, and cybersecurity analytics.

url: "https://derrickmokaya.github.io"   # change to your actual GitHub Pages URL
baseurl: ""

github:
  username: derrickmokaya   # update to your actual GitHub username

social:
  name: Derrick Jesse Mokaya
  email: derekmokaya54@gmail.com
  links:
    - https://www.linkedin.com/in/derrickmokaya   # update to your LinkedIn URL

avatar: /assets/img/avatar.jpg

theme_mode: light   # light | dark

toc: true

comments:
  active: ""   # set to 'disqus', 'utterances', or 'giscus' if you want comments

paginate: 10

# -----------------------------------------------
# SEO & Analytics
# -----------------------------------------------
google_site_verification:    # fill in after Google Search Console setup
google_analytics:
  id:                        # e.g. G-XXXXXXXXXX

# -----------------------------------------------
# Jekyll Build Settings
# -----------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: "_tabs"
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: assets/img/favicons
    values:
      swcache: true

sass:
  style: compressed

compress_html:
  clevel: 9
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - CHANGELOG.md
  - rollup.config.js
  - node_modules
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
